[build]
  command = "npm install && npm run build"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://assets.calendly.com https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src https://calendly.com; img-src 'self' data: https://cdn.prod.website-files.com; connect-src 'self' https://identity.netlify.com https://api.netlify.com"

[[redirects]]
  from = "/blog/full-funnel-google-ads-strategy"
  to = "/blog/full-funnel-google-ads-strategy.html"
  status = 200

[[redirects]]
  from = "/blog/ai-changing-google-ads"
  to = "/blog/ai-changing-google-ads.html"
  status = 200
