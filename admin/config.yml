backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Tag", name: "tag", widget: "string", default: "Marketing" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Reading Time", name: "reading_time", widget: "string", default: "5 min read" }
      - label: "FAQ (for SEO schema)"
        name: "faq"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "q", widget: "string" }
          - { label: "Answer", name: "a", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
